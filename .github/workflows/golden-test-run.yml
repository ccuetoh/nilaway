name: Golden Test

# NilAway output may change due to introduction of new feature or bug fixes. Since NilAway is still
# at early stage of development, constantly updating / maintaining the golden test output will be
# a burden. Therefore, we run this as a separate CI job and post the differences as a PR comment
# for manual reviews.
#
# Note that this workflow is triggered on `pull_request` event, where if the PR is created from
# forked repository, the GITHUB_TOKEN will not have necessary write permission to post the comments.
# To work around this (and to provide proper isolation), we follow the recommended approach [1] of
# separating job into two parts: (1) build and upload results as artifacts in untrusted environment
# (here), and then (2) trigger a follow-up job that downloads the artifacts and posts the comment in
# trusted environment (see .github/workflows/golden-test-comment.yml).
#
# [1]: https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
on:
  pull_request:
  # Allows manually running the golden test on any branch, which is used to collect diagnostics
  # with a configurable number of shards. Manual runs do not post a PR comment (the comment
  # workflow only reacts to `pull_request` runs).
  workflow_dispatch:
    inputs:
      shards:
        description: Number of shards to split the standard library analysis into (1 = no sharding)
        default: "6"
      base_branch:
        description: Base branch to compare against
        default: main

concurrency:
  group: golden-test-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  golden-test:
    name: Run
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_BRANCH: ${{ inputs.base_branch || github.event.pull_request.base.ref || 'main' }}
      SHARDS: ${{ inputs.shards || '6' }}
    steps:
      - uses: actions/checkout@v7
        name: Check out repository

      - name: Fetch base branch (${{ inputs.base_branch || github.event.pull_request.base.ref || 'main' }}) locally
        run: git fetch origin $BASE_BRANCH:$BASE_BRANCH

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # Our Golden tests run NilAway on the entire standard library, which is very resource-intensive.
      # GitHub Actions terminates the job if it hits the resource limits (both in CPU and memory).
      # For CPU limit we set GOMAXPROCS to be one less than the number of available CPUs.
      # For memory limit we set GOMEMLIMIT to 8G. The standard library analysis is split into
      # independent shards (`-shards`) so that each NilAway process stays well below the memory
      # limit instead of thrashing against it.
      - name: Golden Test
        id: golden_test
        run: bash .github/scripts/memmon.sh make golden-test GOMAXPROCS=$(( $(nproc) - 1 )) GOMEMLIMIT=8192MiB ARGS="-base-branch $BASE_BRANCH -shards $SHARDS -result-file ${{ runner.temp }}/golden-test-comment.md"

      - name: Collect failure diagnostics
        if: failure()
        run: bash .github/scripts/failure-diagnostics.sh

      - uses: actions/upload-artifact@v7
        with:
          name: golden-test-comment.md
          path: ${{ runner.temp }}/golden-test-comment.md
