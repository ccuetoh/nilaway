name: NilAway Action

on:
  pull_request:
    paths:
      - ".github/actions/nilaway/**"
      - ".github/workflows/nilaway-action.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/nilaway/**"
      - ".github/workflows/nilaway-action.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: .github/actions/nilaway/nilaway-version.txt
      - name: Run wrapper tests
        run: python3 -B -m unittest discover -s .github/actions/nilaway -p 'test_*.py'

      - name: Scan a clean module
        id: clean
        uses: ./.github/actions/nilaway
        with:
          working-directory: .github/actions/nilaway/testdata/clean
      - name: Warn about a finding from an experimental check
        id: warn
        uses: ./.github/actions/nilaway
        with:
          working-directory: .github/actions/nilaway/testdata/experimental
          experimental-anonymous-function: "true"
          fail-on-findings: "false"
      - name: Fail on a cross-package finding
        id: strict
        continue-on-error: true
        uses: ./.github/actions/nilaway
        with:
          working-directory: .github/actions/nilaway/testdata/cross-package
      - name: Check step results and finding counts
        shell: bash
        env:
          CLEAN_COUNT: ${{ steps.clean.outputs.finding-count }}
          WARN_COUNT: ${{ steps.warn.outputs.finding-count }}
          STRICT_OUTCOME: ${{ steps.strict.outcome }}
          STRICT_COUNT: ${{ steps.strict.outputs.finding-count }}
        run: |
          [[ "$CLEAN_COUNT" == 0 ]]
          [[ "$WARN_COUNT" == 1 ]]
          [[ "$STRICT_OUTCOME" == failure && "$STRICT_COUNT" == 1 ]]
